<!DOCTYPE html>
<html lang="it">
<head>

  <!-- 1. Questo dice a iOS di guardare le regole del Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icona e configurazione PWA fullscreen legacy per iOS -->
  <link rel="apple-touch-icon" href="https://i.imgur.com/ubzrqlk.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Finac€">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      background-color: #000000;
      overflow: hidden;
    }
    iframe {
      /* 2. Cambiato in fixed per bloccare la barra di Safari su iOS */
      position: fixed; 
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }
  </style>
</head>
