<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>My Finac€</title>

  <!-- 1. Questo dice a iOS di guardare le regole del Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icona e configurazione PWA fullscreen legacy per iOS -->
  <link rel="apple-touch-icon" href="https://i.imgur.com/ubzrqlk.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Finac€">
  <meta name="theme-color" content="#000000">

  <style>
* { 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent; 
  -webkit-user-select: none !important; 
  user-select: none !important;        
  -webkit-touch-callout: none !important; 
}

/* Eccezione: permette la selezione e la digitazione nei moduli di input */
input, textarea, select {
  -webkit-user-select: text !important;
  user-select: text !important;
  -webkit-touch-callout: default !important;
}

   html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      background-color: #000000;
      overflow: hidden;
    }

body {
  background-color: #000000 !important;
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  margin: 0;
  
  /* Stacco per Dynamic Island in alto */
  padding-top: 40px !important; 
  padding-left: 12px;
  padding-right: 12px;
  
  min-height: 100dvh;
  width: 100%;
  
  /* Attiva lo scorrimento fluido nell'iframe */
  overflow-y: auto !important;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.dashboard-container {
  height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
  box-sizing: border-box;
}
    iframe {
      /* 2. Cambiato in fixed per bloccare la barra di Safari su iOS */
      position: fixed; 
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbyBlqo_a4p0O_uWGuzAKQ-o1roAdWDHzbbJEdK1miIaTomH4BsurXSw0kyOmSVNMOUoJQ/exec"></iframe>
</body>
</html>
